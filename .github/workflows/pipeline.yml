
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  DATA_PATH: tourism_project/data/tourism.csv
  REQUIREMENTS_PATH: tourism_project/requirements.txt

jobs:
  # ---------- JOB 1: Register Dataset ----------
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: python -m pip install -r "$REQUIREMENTS_PATH"

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------- JOB 2: Data Preparation ----------
  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: python -m pip install -r "$REQUIREMENTS_PATH"

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Verify Registered Dataset
        run: test -f "$DATA_PATH"

      - name: Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Upload Train/Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ---------- JOB 3: Model Training ----------
  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: python -m pip install -r "$REQUIREMENTS_PATH"

      - name: Download Train/Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          for attempt in {1..12}; do
            curl --fail --silent http://127.0.0.1:5000/health && break
            sleep 5
          done
          curl --fail http://127.0.0.1:5000/health

      - name: Model Building
        run: python tourism_project/model_building/train.py

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_model_v1.pkl
          git diff --cached --quiet || git commit -m "Add trained model [skip ci]"
          git push