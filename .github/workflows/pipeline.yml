name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  DATA_PATH: tourism_project/data/tourism.csv
  REQUIREMENTS_PATH: tourism_project/requirements.txt
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000

jobs:
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$REQUIREMENTS_PATH"

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$REQUIREMENTS_PATH"

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Verify Registered Dataset
        run: test -f "$DATA_PATH"

      - name: Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Upload Train/Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error

  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$REQUIREMENTS_PATH"

      - name: Download Train/Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Start MLflow Server
        run: |
          set -euo pipefail
          python -m mlflow server             --backend-store-uri sqlite:///mlflow.db             --default-artifact-root ./mlflow_artifacts             --host 127.0.0.1             --port 5000 > mlflow.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          cat mlflow.log
          exit 1

      - name: Model Building
        run: python tourism_project/model_building/train.py

      - name: Upload MLflow Tracking Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlflow.db
            mlflow_artifacts
            mlflow.log
          if-no-files-found: warn

      - name: Commit Trained Model
        run: |
          test -f tourism_project/deployment/best_model_v1.pkl
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_model_v1.pkl
          git diff --cached --quiet || git commit -m "Add trained model [skip ci]"
          git push
