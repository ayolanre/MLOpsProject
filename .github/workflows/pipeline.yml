### GitHub Actions CI/CD Pipeline (`pipeline.yml`)
'''
This workflow automates the entire MLOps pipeline:
1. **Register Dataset**
2. **Prepare Train/Test Splits**
3. **Train Model + Log to MLflow**
4. **Commit Trained Model Back to Repository**

Each job runs in sequence and passes artifacts (dataset, splits, model) to the next stage.
'''

name: Tourism Project Pipeline

on:
  push:
    branches:
      - main        # Run pipeline automatically when pushing to main
  workflow_dispatch: # Allow manual triggering from GitHub UI

permissions:
  contents: write   # Needed to commit trained model back to repo

jobs:
  # ---------- JOB 1: Register Dataset ----------
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest   # GitHub-hosted Linux runner

    steps:
      - uses: actions/checkout@v4
        # Pulls the repository code into the runner

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Python version for all jobs

      - name: Install Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt
        # Install all required libraries

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
        # Validate dataset and ensure correct schema

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
        # Makes dataset available to next job

  # ---------- JOB 2: Data Preparation ----------
  data-preparation:
    name: Data Preparation
    needs: register-dataset   # Runs only after dataset registration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
        # Retrieves dataset from previous job

      - name: Data Preparation
        run: python tourism_project/model_building/prep.py
        # Creates Xtrain, Xtest, ytrain, ytest

      - name: Upload Train/Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
        # Makes splits available to training job

  # ---------- JOB 3: Model Training ----------
  model-training:
    name: Model Training
    needs: data-preparation   # Runs only after data preparation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt

      - name: Download Train/Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
        # Retrieves prepared data

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &
          sleep 10
        # Launch MLflow UI in background for logging

      - name: Model Building
        run: python tourism_project/model_building/train.py
        # Runs training script, logs metrics, saves model

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/*.pkl
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
        # Pushes trained model back to repository
